<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dompet Digital</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #e9eef6;
    }
    header {
      background-color: #2196F3;
      color: white;
      padding: 16px;
      font-size: 20px;
      display: flex;
      align-items: center;
    }
    header span {
      margin-left: 10px;
    }
    .list {
      padding: 10px;
    }
    .item {
      display: flex;
      align-items: center;
      background: white;
      margin-bottom: 12px;
      border-radius: 8px;
      padding: 12px;
      text-decoration: none;
      color: black;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      transition: transform 0.1s ease;
    }
    .item:hover {
      transform: scale(1.01);
    }
    .item img {
      width: 32px;
      height: 32px;
      margin-right: 12px;
      border-radius: 6px;
    }
    .item .text {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
    }
    .item .arrow {
      font-size: 18px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <header>
    <span>&larr;</span>
    <span>Kembali</span>
  </header>

  <div class="list">
    <a class="item" href="dana.html">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGglzp3pi04sdTe7teWwIj3abbA0HHqwYcxwzXVWi5ueYhk_MwQge3tE8&s=10">
      <div class="text">DANA</div>
      <div class="arrow">&gt;</div>
    </a>
    <a class="item" href="gopay.html">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Logo_Gopay.svg/1200px-Logo_Gopay.svg.png">
      <div class="text">Gopay</div>
      <div class="arrow">&gt;</div>
    </a>
    <a class="item" href="https://link.shopeepay.id">
      <img src="https://asset.brandfetch.io/id2vbq1JkJ/idbE6n_-op.svg">
      <div class="text">ShopeePay</div>
      <div class="arrow">&gt;</div>
    </a>
    <a class="item" href="https://link.ovo.id">
      <img src="https://www.pngitem.com/pimgs/m/198-1985266_ovo-logo-png-transparent-png.png">
      <div class="text">OVO</div>
      <div class="arrow">&gt;</div>
    </a>
    <a class="item" href="https://link.grab.id">
      <img src="https://logowik.com/content/uploads/images/grab.jpg">
      <div class="text">Grab</div>
      <div class="arrow">&gt;</div>
    </a>
    <a class="item" href="https://link.isaku.id">
      <img src="https://play-lh.googleusercontent.com/kciCjHYgUqaZltTh1taekD1hKkyJYo9iDhCgxTY5dxvXFiZ_Su8Od3YshkYoT1hDLw=w240-h480-rw">
      <div class="text">i.saku</div>
      <div class="arrow">&gt;</div>
    </a>
    <a class="item" href="https://link.linkaja.id">
      <img src="https://www.linkaja.id/assets/img/logo.png">
      <div class="text">LinkAja</div>
      <div class="arrow">&gt;</div>
    </a>
    <a class="item" href="https://link.maxim.id">
      <img src="https://play-lh.googleusercontent.com/f4j5doSIfuA35U6UoRgGEKvbgRB3Yt5E3XbSSzR_6OjAl2VKvTfNjkNzjtvWMP0xq2x">
      <div class="text">Maxim</div>
      <div class="arrow">&gt;</div>
    </a>
  </div>
</body>
</html>
